<svg xmlns="http://www.w3.org/2000/svg" width="420" height="96" viewBox="0 0 420 96">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#37BBFE"/>
      <stop offset="1" stop-color="#0077C9"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0077C9" flood-opacity="0.45"/>
    </filter>
    <clipPath id="clip"><rect x="10" y="8" width="400" height="72" rx="36"/></clipPath>
  </defs>

  <g filter="url(#shadow)">
    <rect x="10" y="8" width="400" height="72" rx="36" fill="url(#bg)"/>
  </g>
  <rect x="10.5" y="8.5" width="399" height="71" rx="35.5" fill="none" stroke="#fff" stroke-opacity="0.35"/>

  <!-- moving shine -->
  <g clip-path="url(#clip)">
    <rect x="-120" y="0" width="90" height="96" fill="url(#shine)" transform="skewX(-20)">
      <animate attributeName="x" values="-160;560;560" keyTimes="0;0.6;1" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Telegram logo -->
  <circle cx="54" cy="44" r="26" fill="#fff"/>
  <path d="M41.5 43.2l22.8-8.8c1.1-.4 2 .3 1.7 1.9l-3.9 18.3c-.3 1.3-1.1 1.6-2.2 1l-6-4.4-2.9 2.8c-.3.3-.6.6-1.2.6l.4-6.1 11.1-10c.5-.4-.1-.7-.7-.3l-13.7 8.6-5.9-1.8c-1.3-.4-1.3-1.3.5-1.8z" fill="#229ED9"/>

  <text x="96" y="40" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="23" font-weight="700" fill="#fff">Мой Telegram-канал</text>
  <text x="96" y="64" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" fill="#fff" fill-opacity="0.9">@nonmainfun · подписывайся</text>

  <!-- arrow -->
  <circle cx="374" cy="44" r="18" fill="#fff" fill-opacity="0.2"/>
  <path d="M368 36l9 8-9 8" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
